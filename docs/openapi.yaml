openapi: 3.0.3
info:
  title: Restaurant POS API
  version: 1.0.0
  description: |
    REST API for the Restaurant POS application. Protected routes use a JWT bearer token.
servers:
  - url: http://localhost:3000/api
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Authentication
  - name: Menu
  - name: Orders
  - name: Reports
  - name: Settings
  - name: Audit
paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Application and database health
      responses:
        '200':
          description: Healthy or database is not configured
        '503':
          description: Configured database is unavailable
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: Authenticated user and JWT
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  token: { type: string }
        '401': { description: Invalid credentials or inactive account }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      responses:
        '200': { description: Current user }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/users:
    get:
      tags: [Authentication]
      summary: List user accounts
      description: Admin only. Password fields are never returned.
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Authentication]
      summary: Create a Staff account
      description: Admin only. New accounts always receive the Staff role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
      responses:
        '201': { description: Staff account created }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/users/{id}:
    patch:
      tags: [Authentication]
      summary: Edit or activate/deactivate a Staff account
      description: Admin only. An Admin cannot deactivate their own account; only Staff accounts can be changed through this endpoint.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, format: email }
                active: { type: boolean }
      responses:
        '200': { description: Updated Staff account }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /menu:
    get:
      tags: [Menu]
      summary: List menu items
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: available
          schema: { type: boolean }
        - in: query
          name: includeInactive
          description: Admin only
          schema: { type: boolean }
      responses:
        '200': { description: Menu items }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Menu]
      summary: Create menu item
      description: Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MenuInput' }
      responses:
        '201': { description: Created menu item }
        '403': { $ref: '#/components/responses/Forbidden' }
  /menu/{id}:
    put:
      tags: [Menu]
      summary: Update menu item
      description: Admin only
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                category: { type: string, minLength: 2, maxLength: 40 }
                price: { type: number, minimum: 0 }
                available: { type: boolean }
      responses:
        '200': { description: Updated menu item }
        '404': { $ref: '#/components/responses/NotFound' }
    parameters:
      - $ref: '#/components/parameters/id'
  /menu/{id}/deactivate:
    patch:
      tags: [Menu]
      summary: Deactivate menu item
      description: Admin only
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200': { description: Menu item deactivated }
        '404': { $ref: '#/components/responses/NotFound' }
  /menu/{id}/reactivate:
    patch:
      tags: [Menu]
      summary: Reactivate menu item
      description: Admin only
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200': { description: Menu item reactivated }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders:
    get:
      tags: [Orders]
      summary: Search and paginate orders
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [Pending, Preparing, Ready, Completed] }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200': { description: Paginated order results }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Orders]
      summary: Create order
      description: Staff only. Pricing and totals are calculated by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201': { description: Created order }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    parameters: []
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order detail
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200': { description: Order detail }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/invoice:
    get:
      tags: [Orders]
      summary: Get invoice data
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200': { description: Authoritative order data for invoice }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/items:
    patch:
      tags: [Orders]
      summary: Update unpaid order items
      description: Staff only. Paid or completed orders cannot be edited.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/OrderLineInput' }
                discount: { type: number, minimum: 0, maximum: 100000 }
      responses:
        '200': { description: Updated order }
        '400': { $ref: '#/components/responses/BadRequest' }
  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Advance order status
      description: Staff only. Valid progression is Pending, Preparing, Ready, Completed.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Pending, Preparing, Ready, Completed] }
      responses:
        '200': { description: Updated order }
        '400': { $ref: '#/components/responses/BadRequest' }
  /orders/{id}/payment:
    post:
      tags: [Orders]
      summary: Record payment
      description: Staff only. Amount must cover the order total; duplicate payments are rejected.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method: { type: string, enum: [Cash, UPI] }
                amount: { type: number, minimum: 0, exclusiveMinimum: true }
      responses:
        '200': { description: Order marked paid }
        '400': { $ref: '#/components/responses/BadRequest' }
  /reports/daily-sales:
    get:
      tags: [Reports]
      summary: Daily sales metrics
      responses:
        '200': { description: Order count, completed count, sales, and average order }
  /settings:
    get:
      tags: [Settings]
      summary: Get billing policy
      description: Admin only
      responses:
        '200': { description: Current tax and maximum discount settings }
    patch:
      tags: [Settings]
      summary: Update billing policy
      description: Admin only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taxRate, maxDiscount]
              properties:
                taxRate: { type: number, minimum: 0, maximum: 100 }
                maxDiscount: { type: number, minimum: 0, maximum: 100000 }
      responses:
        '200': { description: Updated billing policy }
  /audit-logs:
    get:
      tags: [Audit]
      summary: List recent audit entries
      description: Admin only. Returns at most 200 entries.
      responses:
        '200': { description: Audit entries }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      in: path
      name: id
      required: true
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or deactivated user session
    Forbidden:
      description: Authenticated role is not permitted
    BadRequest:
      description: Request validation or business rule failure
    NotFound:
      description: Requested resource not found
  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [Admin, Staff] }
        active: { type: boolean }
    MenuInput:
      type: object
      required: [name, category, price]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        category: { type: string, minLength: 2, maxLength: 40 }
        price: { type: number, minimum: 0 }
        available: { type: boolean, default: true }
    OrderLineInput:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 50 }
    OrderInput:
      type: object
      required: [type, items]
      properties:
        type: { type: string, enum: [Dine-in, Takeaway] }
        tableNumber: { type: integer, minimum: 1, description: Required when type is Dine-in }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderLineInput' }
        discount: { type: number, minimum: 0, maximum: 100000, default: 0 }
